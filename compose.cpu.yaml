# Standalone CPU configuration; do not merge with the GPU compose file.
services:
  face-verification:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.12-slim-bookworm}
    image: face-verification:local
    platform: linux/amd64
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      FACE_DEVICE: cpu
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped

  download-models:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.12-slim-bookworm}
    image: face-verification:local
    platform: linux/amd64
    profiles: [tools]
    user: "0:0"
    environment:
      FACE_DEVICE: cpu
    volumes:
      - ./models:/app/models
    command: ["python", "download_models.py"]
